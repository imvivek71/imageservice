openapi: 3.0.3
info:
  title: Image Service API
  version: 1.0.0
  description: APIs for uploading, listing, viewing, and deleting images with metadata.
servers:
  - url: http://localhost:8080
paths:
  /images:
    post:
      summary: Upload an image with metadata
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
          description: User identifier (required)
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated tags (e.g., "tag1,tag2")
        - in: query
          name: description
          schema:
            type: string
          description: Image description
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Image uploaded successfully (processing asynchronously)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  image_id:
                    type: string
                  processing_status:
                    type: string
                    enum: [pending, completed]
                  metadata:
                    $ref: '#/components/schemas/ImageMetadata'
    get:
      summary: List all images with filters
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          description: Filter by user ID
        - in: query
          name: tag
          schema:
            type: string
          description: Filter by tag
      responses:
        '200':
          description: List of images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageMetadata'
  /images/{imageId}:
    get:
      summary: View/download an image - returns presigned URLs for all variants
      parameters:
        - in: path
          name: imageId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image metadata and presigned URLs for all variants
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_id:
                    type: string
                  metadata:
                    $ref: '#/components/schemas/ImageMetadata'
                  download_urls:
                    type: object
                    properties:
                      original:
                        type: string
                        description: Presigned URL for original image
                      medium:
                        type: string
                        description: Presigned URL for 1024x1024 variant
                      thumbnail:
                        type: string
                        description: Presigned URL for 200x200 variant
                  default_url:
                    type: string
                    description: Default presigned URL (medium or original)
        '404':
          description: Image not found
    delete:
      summary: Delete an image
      parameters:
        - in: path
          name: imageId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Image deleted successfully
components:
  schemas:
    ImageMetadata:
      type: object
      properties:
        PK:
          type: string
          description: USER#<user_id>
        SK:
          type: string
          description: IMAGE#<created_at>#<image_id>
        image_id:
          type: string
          description: Unique image identifier
        user_id:
          type: string
          description: Owner of the image
        s3_bucket:
          type: string
          description: S3 bucket name
        s3_folder:
          type: string
          description: S3 folder path (images/user_id={user_id}/image_id={image_id})
        s3_prefix:
          type: string
          description: Same as s3_folder
        content_type:
          type: string
          description: Image content type (e.g., image/jpeg)
        size_bytes:
          type: integer
          description: Original image size in bytes
        width:
          type: integer
          description: Image width in pixels
        height:
          type: integer
          description: Image height in pixels
        aspect_ratio:
          type: string
          description: Image aspect ratio (e.g., 4:3)
        visibility:
          type: string
          enum: [public, private, followers]
          description: Image visibility level
        tags:
          type: array
          items:
            type: string
          description: Image tags for filtering
        description:
          type: string
          description: Image description
        created_at:
          type: string
          format: date-time
          description: Image upload timestamp
        variants:
          type: array
          items:
            type: string
            enum: [original, medium, thumbnail]
          description: Available image variants
        processing_status:
          type: string
          enum: [pending, completed]
          description: Image processing status
        likes_count:
          type: integer
          description: Number of likes
        comments_count:
          type: integer
          description: Number of comments
        is_deleted:
          type: boolean
          description: Soft delete flag
