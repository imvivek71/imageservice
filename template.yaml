AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Image Service API - LocalStack SAM Template

Globals:
  Function:
    Runtime: python3.8
    Timeout: 30
    Handler: app.lambda_handler
    Environment:
      Variables:
        TABLE_NAME: !Ref ImageTable
        BUCKET_NAME: !Ref ImageBucket

Resources:
  ImageApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      EndpointConfiguration: REGIONAL

  ImageUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: upload.lambda_handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images
            Method: post

  ImageListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: list.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ImageTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images
            Method: get

  ImageGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: get.lambda_handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBReadPolicy:
            TableName: !Ref ImageTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}
            Method: get

  ImageDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: delete.lambda_handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{image_id}
            Method: delete

  ImageProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: image_processor.lambda_handler
      Timeout: 60
      MemorySize: 1024
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ImageTable
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Ref ImageBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: images/user_id=
                  - Name: suffix
                    Value: original.jpg

  ImageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ImageService
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: image-service-bucket

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL for dev environment"
    Value: !Sub "http://${ImageApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
  
  ImageTableName:
    Description: "DynamoDB Table Name"
    Value: !Ref ImageTable
  
  ImageBucketName:
    Description: "S3 Bucket Name"
    Value: !Ref ImageBucket
