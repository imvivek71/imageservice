AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Image Service API - LocalStack SAM Template

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    Environment:
      Variables:
        TABLE_NAME: !Ref ImageTable
        BUCKET_NAME: !Ref ImageBucket

Resources:

  ImageApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev

  ImageUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.upload.lambda_handler
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images
            Method: POST

  ImageListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.list.lambda_handler
      Events:
        ListApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images
            Method: GET

  ImageGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.get.lambda_handler
      Events:
        GetApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{imageId}
            Method: GET

  ImageDeleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.delete.lambda_handler
      Events:
        DeleteApi:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /images/{imageId}
            Method: DELETE

  ImageProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.image_processor.lambda_handler
      Timeout: 60

  ImageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: image-metadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: image-service-bucket

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint
    Value: !Sub "http://${ImageApi}.execute-api.${AWS::Region}.amazonaws.com/dev"

  ImageTableName:
    Value: !Ref ImageTable

  ImageBucketName:
    Value: !Ref ImageBucket
